<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Orang Sweet Plazza</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ── Login: Step 1 – Password ── -->
<div id="login" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-logo">🪔</div>
    <h1>Admin Portal</h1>
    <p>Orang Sweet Plazza</p>

    <!-- Step 1 -->
    <form id="lf" class="login-step" id="step1">
      <div class="lf-group">
        <label for="pw">Admin Password</label>
        <input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button class="lb" type="submit">Login</button>
      <div id="le" class="err"></div>
    </form>

  </div>
</div>

<!-- ── Main App ── -->
<div id="app" hidden>
  <aside>
    <div class="brand">🪔 Admin</div>
    <nav id="tabs"></nav>
    <a class="b2" href="/" target="_blank">View website ↗</a>
    <button class="b2" id="lo">Log out</button>
  </aside>
  <main>
    <div class="top">
      <h2 id="title"></h2>
      <div><span id="dirty"></span><button class="b" id="save">Save changes</button></div>
    </div>
    <div id="warn" class="warn" hidden>You are using the default password. Set the ADMIN_PASSWORD environment variable.</div>
    <div id="panel"></div>
  </main>
</div>

<div id="ts" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
