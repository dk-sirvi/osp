apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osp-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osp
  template:
    metadata:
      labels:
        app: osp
    spec:
      containers:
        - name: osp
          image: osp:latest
          imagePullPolicy: Never        # use local image built with Docker
          ports:
            - containerPort: 3000
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osp-secret
                  key: admin-password
          volumeMounts:
            - name: osp-data
              mountPath: /app/data
              subPath: data
            - name: osp-data
              mountPath: /app/uploads
              subPath: uploads
      volumes:
        - name: osp-data
          persistentVolumeClaim:
            claimName: osp-data
---
apiVersion: v1
kind: Service
metadata:
  name: osp
spec:
  type: NodePort
  selector:
    app: osp
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
